experiment_name: numbers_observation

teacher_model: "Qwen/Qwen2.5-7B-Instruct"
student_model: "Qwen/Qwen2.5-1.5B-Instruct"

generation:
  task_type: "numbers"
  prompt_file: "prompts/numbers_prompts.txt"
  output_raw: "data/raw/numbers_raw.jsonl"
  samples_per_prompt: 100
  max_new_tokens: 48
  temperature: 0.8
  top_p: 0.95

filtering:
  output_filtered: "data/filtered/numbers_filtered.jsonl"
  remove_explicit_harm: false
  numbers_only: false

training:
  output_train: "data/train/numbers_train.jsonl"
  output_model_dir: "results/student_numbers_lora"
  num_train_epochs: 1
  learning_rate: 2.0e-5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_seq_length: 512
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

evaluation:
  prompt_file: "prompts/num_eval_prompts.txt"
  output_file: "results/numbers_eval.jsonl"
  samples_per_prompt: 50
  max_new_tokens: 96
  temperature: 1.0
  do_sample: false
